# Keeps the Render free-tier backend from sleeping.
# Pings GET /health every 10 minutes (Render sleeps after ~15 min idle).
#
# Setup: repo Settings → Secrets and variables → Actions → New secret:
#   RENDER_BACKEND_URL = https://damsafe-api.onrender.com  (your service URL, no trailing /health)
#
# The Render-native cron in render.yaml (damsafe-keep-alive) is the primary
# keep-alive; this workflow is a free external backup.

name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # manual "Run workflow" button for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /health
        run: |
          URL="${{ secrets.RENDER_BACKEND_URL }}/health"
          echo "Pinging $URL"
          CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 25 "$URL" || echo "000")
          cat /tmp/health.json || true
          echo "HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "Keep-alive ping failed with HTTP $CODE" >&2
            exit 1
          fi
