services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: damsafe
      POSTGRES_USER: damsafe
      POSTGRES_PASSWORD: changeme
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U damsafe"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - keycloakdata:/opt/keycloak/data

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://damsafe:changeme@postgres:5432/damsafe
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: damsafe
      OIDC_ISSUER: http://keycloak:8080/realms/damsafe
      OIDC_CLIENT_ID: damsafe-api
      OIDC_CLIENT_SECRET: ""
      ENVIRONMENT: development
      # Terrain providers: curated DEM tree (read-only) + acquired-DEM cache.
      DAMSAFE_TERRAIN_DIR: /data/terrain
      DAMSAFE_DEM_CACHE: /data/dem-cache
      # Copernicus Data Space S3 (values from shell env, never committed).
      CDSE_S3_ACCESS_KEY: ${CDSE_S3_ACCESS_KEY:-}
      CDSE_S3_SECRET_KEY: ${CDSE_S3_SECRET_KEY:-}
      # OpenTopography last-resort fallback (optional).
      OPENTOPOGRAPHY_API_KEY: ${OPENTOPOGRAPHY_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - ../3d-assets/terrain-pipeline/output:/data/terrain:ro
      - dem-cache:/data/dem-cache
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A app.worker worker --loglevel=info --concurrency=2
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://damsafe:changeme@postgres:5432/damsafe
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: damsafe
    volumes:
      - ../backend:/app
      - solver-data:/data/solver
      - ../3d-assets/procedural-generator:/opt/damgen:ro

  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A app.worker beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://damsafe:changeme@postgres:5432/damsafe
      REDIS_URL: redis://redis:6379/0

  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    ports:
      - "8001:8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public/terrain:/app/public/terrain

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@damsafe.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
  miniodata:
  keycloakdata:
  solver-data:
  dem-cache:
